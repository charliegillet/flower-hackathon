[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mortgage-forum"
version = "0.1.0"
description = "Private mortgage rate finder: user and bank agents negotiate inside one closed Flower AgentApp run"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.38.0,<2.0", "openai>=2.16.0,<3.0.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["mortgage_forum"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["mortgage_forum/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "mortgage_forum.agent_app:app"

[tool.flwr.app.config]
# Model served through Flower Runtime. For local Ollama use e.g. "qwen3.5:4b".
# model = "openai/gpt-5.6-sol"
model = "qwen2.5-coder:14b"
negotiation-rounds = 1
term-years = 25

[tool.pytest.ini_options]
testpaths = ["tests"]
