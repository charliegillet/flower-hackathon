[project]
name = "blindquote-workspace"
version = "0.1.0"
description = "Dev workspace for BlindQuote: the AgentApp (./blindquote), simulator, UI server and tests."
requires-python = ">=3.11,<3.14"
dependencies = [
    "blindquote",
    "flwr==1.39.0",
    "openai>=2.16.0,<3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
blindquote = { path = "blindquote", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
