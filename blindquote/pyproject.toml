[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindquote"
version = "0.1.0"
description = "Shop every mortgage lender without becoming a lead: sealed, negotiated quotes from bank SuperNodes that only ever see attested bands."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["blindquote"]

[tool.flwr.app]
publisher = "charliegillet"
display-name = "BlindQuote"
color = "emerald"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["blindquote/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "blindquote.agent_app:app"
